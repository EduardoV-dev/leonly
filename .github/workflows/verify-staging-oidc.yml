name: Verify staging AWS OIDC

on:
  push:
    branches:
      - staging
    paths:
      - .github/workflows/verify-staging-oidc.yml
  workflow_dispatch:

jobs:
  verify:
    name: Verify ${{ matrix.environment }}
    if: ${{ github.ref == 'refs/heads/staging' }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: infra-staging
            role: leonly-deploy-infra-staging
          - environment: app-staging
            role: leonly-deploy-app-staging
    steps:
      - name: Assume AWS role for ${{ matrix.environment }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::458818293454:role/${{ matrix.role }}
          role-session-name: staging-oidc-smoke

      - name: Verify AWS identity for ${{ matrix.environment }}
        env:
          EXPECTED_ARN: arn:aws:sts::458818293454:assumed-role/${{ matrix.role }}/staging-oidc-smoke
        run: |
          actual=$(aws sts get-caller-identity --query Arn --output text)
          printf 'Expected: %s\nActual:   %s\n' "$EXPECTED_ARN" "$actual"
          test "$actual" = "$EXPECTED_ARN"
