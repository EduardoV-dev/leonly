services:
  floci:
    image: floci/floci:latest
    user: "0:0"
    ports:
      - "4566:4566"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leonly
      POSTGRES_USER: leonly
      POSTGRES_PASSWORD: leonly
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leonly -d leonly"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
