services:
  floci:
    image: floci/floci:latest
    user: "0:0"
    environment:
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: api_default
    ports:
      - "4566:4566"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: leonly
      POSTGRES_USER: leonly
      POSTGRES_PASSWORD: leonly
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leonly -d leonly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis-http:
    image: hiett/serverless-redis-http:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SRH_MODE: env
      SRH_TOKEN: local-redis-token
      SRH_CONNECTION_STRING: redis://redis:6379
    ports:
      - "8079:80"

volumes:
  postgres-data:
